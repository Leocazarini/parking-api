name: parking-api

services:
  bootstrap:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.secrets/.env
    command: sh -c "alembic upgrade head && python scripts/create_admin.py"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file: ../.secrets/.env
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - ../src:/app/src

  db:
    image: postgres:16
    env_file: ../.secrets/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    env_file: ../.secrets/.env.test
    command: pytest tests/ -v
    profiles:
      - testing
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
